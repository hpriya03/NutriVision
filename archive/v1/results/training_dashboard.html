<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NutriVision — Training Dashboard</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  .viz-root {
    color-scheme: light;
    --surface-1: #fcfcfb;
    --text-primary: #0b0b0b;
    --text-secondary: #52514e;
    --text-muted: #898781;
    --gridline: #e1e0d9;
    --baseline: #c3c2b7;
    --series-1: #2a78d6;
    --series-2: #eb6834;
    --series-3: #1baf7a;
    --series-4: #eda100;
    --font: system-ui, -apple-system, "Segoe UI", sans-serif;
  }

  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) .viz-root {
      color-scheme: dark;
      --surface-1: #1a1a19;
      --text-primary: #ffffff;
      --text-secondary: #c3c2b7;
      --text-muted: #898781;
      --gridline: #2c2c2a;
      --baseline: #383835;
      --series-1: #3987e5;
      --series-2: #d95926;
      --series-3: #199e70;
      --series-4: #c98500;
    }
  }

  :root[data-theme="dark"] .viz-root {
    color-scheme: dark;
    --surface-1: #1a1a19;
    --text-primary: #ffffff;
    --text-secondary: #c3c2b7;
    --text-muted: #898781;
    --gridline: #2c2c2a;
    --baseline: #383835;
    --series-1: #3987e5;
    --series-2: #d95926;
    --series-3: #199e70;
    --series-4: #c98500;
  }

  body {
    font-family: var(--font);
    background: var(--surface-1);
    color: var(--text-primary);
    max-width: 800px;
    margin: 0 auto;
    padding: 24px 16px;
  }

  h1 {
    font-size: 1.5rem;
    font-weight: 600;
    margin-bottom: 4px;
  }

  .subtitle {
    color: var(--text-secondary);
    font-size: 0.9rem;
    margin-bottom: 32px;
  }

  h2 {
    font-size: 1.2rem;
    font-weight: 600;
    margin: 32px 0 16px;
    padding-top: 24px;
    border-top: 1px solid var(--gridline);
  }

  h3 {
    font-size: 0.95rem;
    font-weight: 500;
    color: var(--text-secondary);
    margin-bottom: 12px;
  }

  .stat-row {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 24px;
  }

  .stat-tile {
    flex: 1;
    min-width: 120px;
    padding: 16px;
    border: 1px solid var(--gridline);
    border-radius: 8px;
  }

  .stat-label {
    font-size: 0.75rem;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin-bottom: 4px;
  }

  .stat-value {
    font-size: 1.5rem;
    font-weight: 600;
  }

  .chart-container {
    margin-bottom: 28px;
  }

  canvas {
    display: block;
    width: 100%;
    max-width: 700px;
  }

  .legend {
    display: flex;
    gap: 16px;
    margin-top: 8px;
    flex-wrap: wrap;
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 0.8rem;
    color: var(--text-secondary);
  }

  .legend-swatch {
    width: 12px;
    height: 3px;
    border-radius: 1px;
  }

  .tooltip {
    position: absolute;
    background: var(--surface-1);
    border: 1px solid var(--baseline);
    border-radius: 6px;
    padding: 8px 12px;
    font-size: 0.8rem;
    pointer-events: none;
    display: none;
    z-index: 10;
    box-shadow: 0 2px 8px rgba(0,0,0,0.12);
  }

  .tooltip-label {
    color: var(--text-muted);
    font-size: 0.7rem;
  }

  .tooltip-value {
    font-weight: 600;
    margin-top: 2px;
  }
</style>
</head>

<script>
// ── Chart drawing utilities ──

const seriesColors = [
    getComputedStyle(document.body).getPropertyValue('--series-1').trim(),
    getComputedStyle(document.body).getPropertyValue('--series-2').trim(),
    getComputedStyle(document.body).getPropertyValue('--series-3').trim(),
    getComputedStyle(document.body).getPropertyValue('--series-4').trim(),
];

function getSeriesColor(i) {
    return seriesColors[i % seriesColors.length];
}

const cs = getComputedStyle(document.body);
const gridColor = cs.getPropertyValue('--gridline').trim();
const baselineColor = cs.getPropertyValue('--baseline').trim();
const textMuted = cs.getPropertyValue('--text-muted').trim();
const textSecondary = cs.getPropertyValue('--text-secondary').trim();
const surface = cs.getPropertyValue('--surface-1').trim();

function drawLineChart(canvasId, xData, yData, opts = {}) {
    const canvas = document.getElementById(canvasId);
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    const dpr = window.devicePixelRatio || 1;
    const w = canvas.width;
    const h = canvas.height;
    canvas.width = w * dpr;
    canvas.height = h * dpr;
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
    ctx.scale(dpr, dpr);

    const pad = { top: 20, right: 20, bottom: 40, left: 60 };
    const cw = w - pad.left - pad.right;
    const ch = h - pad.top - pad.bottom;

    const xMin = Math.min(...xData);
    const xMax = Math.max(...xData);
    const yMin = Math.min(...yData) * 0.9;
    const yMax = Math.max(...yData) * 1.05;

    function toX(v) { return pad.left + (v - xMin) / (xMax - xMin) * cw; }
    function toY(v) { return pad.top + ch - (v - yMin) / (yMax - yMin) * ch; }

    // Grid
    ctx.strokeStyle = gridColor;
    ctx.lineWidth = 1;
    const nTicks = 5;
    for (let i = 0; i <= nTicks; i++) {
        const yVal = yMin + (yMax - yMin) * i / nTicks;
        const y = toY(yVal);
        ctx.beginPath();
        ctx.moveTo(pad.left, y);
        ctx.lineTo(w - pad.right, y);
        ctx.stroke();

        ctx.fillStyle = textMuted;
        ctx.font = '11px system-ui';
        ctx.textAlign = 'right';
        ctx.textBaseline = 'middle';
        if (opts.scientific) {
            ctx.fillText(yVal.toExponential(1), pad.left - 8, y);
        } else {
            ctx.fillText(yVal.toFixed(yVal < 1 ? 4 : 1), pad.left - 8, y);
        }
    }

    // Baseline
    ctx.strokeStyle = baselineColor;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(pad.left, pad.top + ch);
    ctx.lineTo(w - pad.right, pad.top + ch);
    ctx.stroke();

    // X-axis ticks
    const xTicks = 5;
    for (let i = 0; i <= xTicks; i++) {
        const xVal = xMin + (xMax - xMin) * i / xTicks;
        const x = toX(xVal);
        ctx.fillStyle = textMuted;
        ctx.font = '11px system-ui';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'top';
        ctx.fillText(Math.round(xVal).toLocaleString(), x, pad.top + ch + 8);
    }

    // Axis labels
    ctx.fillStyle = textSecondary;
    ctx.font = '12px system-ui';
    ctx.textAlign = 'center';
    ctx.fillText(opts.xLabel || '', pad.left + cw/2, h - 4);

    ctx.save();
    ctx.translate(14, pad.top + ch/2);
    ctx.rotate(-Math.PI/2);
    ctx.fillText(opts.yLabel || '', 0, 0);
    ctx.restore();

    // Line
    const color = opts.color || seriesColors[0];
    ctx.strokeStyle = color;
    ctx.lineWidth = 2;
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';
    ctx.beginPath();
    for (let i = 0; i < xData.length; i++) {
        const x = toX(xData[i]);
        const y = toY(yData[i]);
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
    }
    ctx.stroke();

    // Area fill (10% opacity)
    ctx.fillStyle = color + '1a';
    ctx.beginPath();
    ctx.moveTo(toX(xData[0]), toY(yData[0]));
    for (let i = 1; i < xData.length; i++) {
        ctx.lineTo(toX(xData[i]), toY(yData[i]));
    }
    ctx.lineTo(toX(xData[xData.length-1]), pad.top + ch);
    ctx.lineTo(toX(xData[0]), pad.top + ch);
    ctx.closePath();
    ctx.fill();

    // End dot
    const lastX = toX(xData[xData.length-1]);
    const lastY = toY(yData[yData.length-1]);
    ctx.beginPath();
    ctx.arc(lastX, lastY, 4, 0, Math.PI*2);
    ctx.fillStyle = surface;
    ctx.fill();
    ctx.strokeStyle = color;
    ctx.lineWidth = 2;
    ctx.stroke();

    // End label
    ctx.fillStyle = textSecondary;
    ctx.font = '11px system-ui';
    ctx.textAlign = 'left';
    const endLabel = opts.scientific ?
        yData[yData.length-1].toExponential(1) :
        yData[yData.length-1].toFixed(4);
    ctx.fillText(endLabel, lastX + 8, lastY + 4);

    // Hover
    setupHover(canvas, xData, yData, toX, toY, opts);
}

function drawBarChart(canvasId, data, opts = {}) {
    const canvas = document.getElementById(canvasId);
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    const dpr = window.devicePixelRatio || 1;
    const w = canvas.width;
    const h = canvas.height;
    canvas.width = w * dpr;
    canvas.height = h * dpr;
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
    ctx.scale(dpr, dpr);

    const pad = { top: 20, right: 20, bottom: 40, left: 60 };
    const cw = w - pad.left - pad.right;
    const ch = h - pad.top - pad.bottom;

    const keys = Object.keys(data);
    const values = Object.values(data);
    const yMax = Math.max(...values) * 1.15;

    const barWidth = Math.min(24, cw / keys.length * 0.6);
    const gap = (cw - barWidth * keys.length) / (keys.length + 1);

    const color = opts.color || seriesColors[0];

    // Grid
    ctx.strokeStyle = gridColor;
    ctx.lineWidth = 1;
    for (let i = 0; i <= 4; i++) {
        const yVal = yMax * i / 4;
        const y = pad.top + ch - (yVal / yMax) * ch;
        ctx.beginPath();
        ctx.moveTo(pad.left, y);
        ctx.lineTo(w - pad.right, y);
        ctx.stroke();

        ctx.fillStyle = textMuted;
        ctx.font = '11px system-ui';
        ctx.textAlign = 'right';
        ctx.textBaseline = 'middle';
        ctx.fillText(yVal.toFixed(yVal < 1 ? 4 : 1), pad.left - 8, y);
    }

    // Baseline
    ctx.strokeStyle = baselineColor;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(pad.left, pad.top + ch);
    ctx.lineTo(w - pad.right, pad.top + ch);
    ctx.stroke();

    // Bars
    keys.forEach((key, i) => {
        const x = pad.left + gap + i * (barWidth + gap);
        const barH = (values[i] / yMax) * ch;
        const y = pad.top + ch - barH;

        // Bar with rounded top
        ctx.fillStyle = color;
        ctx.beginPath();
        const r = 4;
        ctx.moveTo(x, pad.top + ch);
        ctx.lineTo(x, y + r);
        ctx.arcTo(x, y, x + r, y, r);
        ctx.arcTo(x + barWidth, y, x + barWidth, y + r, r);
        ctx.lineTo(x + barWidth, pad.top + ch);
        ctx.closePath();
        ctx.fill();

        // Value on cap
        ctx.fillStyle = textSecondary;
        ctx.font = '11px system-ui';
        ctx.textAlign = 'center';
        ctx.fillText(values[i].toFixed(4), x + barWidth/2, y - 8);

        // X label
        ctx.fillStyle = textMuted;
        ctx.textBaseline = 'top';
        ctx.fillText("Epoch " + key, x + barWidth/2, pad.top + ch + 8);
    });

    // Axis labels
    ctx.fillStyle = textSecondary;
    ctx.font = '12px system-ui';
    ctx.textAlign = 'center';
    ctx.fillText(opts.xLabel || '', pad.left + cw/2, h - 4);

    ctx.save();
    ctx.translate(14, pad.top + ch/2);
    ctx.rotate(-Math.PI/2);
    ctx.fillText(opts.yLabel || '', 0, 0);
    ctx.restore();
}

function drawMultiLineChart(canvasId, datasets, opts = {}) {
    const canvas = document.getElementById(canvasId);
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    const dpr = window.devicePixelRatio || 1;
    const w = canvas.width;
    const h = canvas.height;
    canvas.width = w * dpr;
    canvas.height = h * dpr;
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
    ctx.scale(dpr, dpr);

    const pad = { top: 20, right: 80, bottom: 40, left: 60 };
    const cw = w - pad.left - pad.right;
    const ch = h - pad.top - pad.bottom;

    let xMin = Infinity, xMax = -Infinity, yMin = Infinity, yMax = -Infinity;
    datasets.forEach(d => {
        xMin = Math.min(xMin, ...d.steps);
        xMax = Math.max(xMax, ...d.steps);
        yMin = Math.min(yMin, ...d.losses);
        yMax = Math.max(yMax, ...d.losses);
    });
    yMin *= 0.9;
    yMax *= 1.05;

    function toX(v) { return pad.left + (v - xMin) / (xMax - xMin) * cw; }
    function toY(v) { return pad.top + ch - (v - yMin) / (yMax - yMin) * ch; }

    // Grid
    ctx.strokeStyle = gridColor;
    ctx.lineWidth = 1;
    for (let i = 0; i <= 5; i++) {
        const yVal = yMin + (yMax - yMin) * i / 5;
        const y = toY(yVal);
        ctx.beginPath();
        ctx.moveTo(pad.left, y);
        ctx.lineTo(w - pad.right, y);
        ctx.stroke();

        ctx.fillStyle = textMuted;
        ctx.font = '11px system-ui';
        ctx.textAlign = 'right';
        ctx.textBaseline = 'middle';
        ctx.fillText(yVal.toFixed(4), pad.left - 8, y);
    }

    // Baseline
    ctx.strokeStyle = baselineColor;
    ctx.beginPath();
    ctx.moveTo(pad.left, pad.top + ch);
    ctx.lineTo(w - pad.right, pad.top + ch);
    ctx.stroke();

    // Lines
    const legendEl = document.getElementById(canvasId + '-legend');
    datasets.forEach((d, idx) => {
        const color = seriesColors[d.color_idx % seriesColors.length];

        ctx.strokeStyle = color;
        ctx.lineWidth = 2;
        ctx.lineJoin = 'round';
        ctx.lineCap = 'round';
        ctx.beginPath();
        for (let i = 0; i < d.steps.length; i++) {
            const x = toX(d.steps[i]);
            const y = toY(d.losses[i]);
            if (i === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
        }
        ctx.stroke();

        // End dot with surface ring
        const lx = toX(d.steps[d.steps.length-1]);
        const ly = toY(d.losses[d.losses.length-1]);
        ctx.beginPath();
        ctx.arc(lx, ly, 5, 0, Math.PI*2);
        ctx.fillStyle = surface;
        ctx.fill();
        ctx.strokeStyle = color;
        ctx.lineWidth = 2;
        ctx.stroke();

        // End label
        ctx.fillStyle = textSecondary;
        ctx.font = '11px system-ui';
        ctx.textAlign = 'left';
        ctx.fillText(d.losses[d.losses.length-1].toFixed(4), lx + 8, ly + 4);

        // Legend
        if (legendEl) {
            const item = document.createElement('div');
            item.className = 'legend-item';
            item.innerHTML = `<span class="legend-swatch" style="background:${color}"></span>${d.name}`;
            legendEl.appendChild(item);
        }
    });

    // Axis labels
    ctx.fillStyle = textSecondary;
    ctx.font = '12px system-ui';
    ctx.textAlign = 'center';
    ctx.fillText(opts.xLabel || '', pad.left + cw/2, h - 4);

    ctx.save();
    ctx.translate(14, pad.top + ch/2);
    ctx.rotate(-Math.PI/2);
    ctx.fillText(opts.yLabel || '', 0, 0);
    ctx.restore();
}

function setupHover(canvas, xData, yData, toX, toY, opts) {
    const tooltip = document.getElementById('tooltip');
    const tooltipLabel = document.getElementById('tooltip-label');
    const tooltipValue = document.getElementById('tooltip-value');

    canvas.addEventListener('mousemove', (e) => {
        const rect = canvas.getBoundingClientRect();
        const mx = e.clientX - rect.left;
        let closest = 0;
        let minDist = Infinity;
        for (let i = 0; i < xData.length; i++) {
            const dpr = window.devicePixelRatio || 1;
            const d = Math.abs(toX(xData[i]) - mx);
            if (d < minDist) {
                minDist = d;
                closest = i;
            }
        }
        if (minDist < 30) {
            tooltipLabel.textContent = (opts.xLabel || 'Step') + ' ' + xData[closest];
            const val = opts.scientific ?
                yData[closest].toExponential(2) :
                yData[closest].toFixed(yData[closest] < 1 ? 6 : 2);
            tooltipValue.textContent = (opts.yLabel || '') + ': ' + val;
            tooltip.style.display = 'block';
            tooltip.style.left = (e.pageX + 12) + 'px';
            tooltip.style.top = (e.pageY - 30) + 'px';
        } else {
            tooltip.style.display = 'none';
        }
    });

    canvas.addEventListener('mouseleave', () => {
        tooltip.style.display = 'none';
    });
}
